<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrôles MeliCases</title><style>body{background:#0b1118;color:#fff;font:16px system-ui;max-width:620px;margin:40px auto;padding:20px}.row{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #ffffff20}button{background:#243448;color:#fff;border:1px solid #ffffff30;padding:9px 16px;border-radius:8px}#save{width:100%;margin-top:18px;background:#ff6038;color:#111;font-weight:bold}</style></head><body><h1>Options des contrôles</h1><p>Cliquez une commande puis appuyez sur la touche voulue.</p><div id="list"></div><button id="save">ENREGISTRER</button><script>const defaults={forward:'KeyW',back:'KeyS',left:'KeyQ',right:'KeyD',interact:'KeyE',run:'ShiftLeft',pause:'Escape'},labels={forward:'Avancer',back:'Reculer',left:'Gauche',right:'Droite',interact:'Interagir',run:'Courir',pause:'Pause'};let map={...defaults,...JSON.parse(localStorage.getItem('meliControls')||'{}')},waiting=null;function draw(){list.innerHTML=Object.entries(labels).map(([k,v])=>`<div class="row"><span>${v}</span><button data-k="${k}">${map[k]}</button></div>`).join('');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{waiting=b.dataset.k;b.textContent='Appuyez sur une touche…'})}addEventListener('keydown',e=>{if(!waiting)return;e.preventDefault();map[waiting]=e.code;waiting=null;draw()});save.onclick=()=>{localStorage.setItem('meliControls',JSON.stringify(map));location.href='game.html'};draw();</script></body></html>
