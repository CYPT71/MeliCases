<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeliCases Formateur</title><style>body{margin:0;background:#0b1118;color:#eef;font:15px system-ui}.wrap{max-width:1100px;margin:auto;padding:24px}h1{font-size:34px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#121c28;border:1px solid #ffffff20;border-radius:14px;padding:18px}textarea,input,select,button{width:100%;margin:6px 0;padding:10px;background:#0a1018;color:#fff;border:1px solid #ffffff28;border-radius:8px}button{background:#ff6038;color:#111;font-weight:800;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#09101a;padding:12px;border-radius:8px;text-align:center}.metric b{font-size:25px;display:block}.ok{color:#4ade80}.warn{color:#fb923c}@media(max-width:750px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>Console <span style="color:#ff6038">Formateur</span></h1><div class="grid"><div class="card"><h2>Connexion P2P sans API</h2><button id="offer">1. Créer le code formateur</button><textarea id="local" rows="5" placeholder="Code à transmettre à l'apprenant"></textarea><textarea id="remote" rows="5" placeholder="Collez ici le code réponse de l'apprenant"></textarea><button id="answer">2. Valider la réponse apprenant</button><p>État : <b id="status">hors ligne</b></p></div><div class="card"><h2>Session</h2><label>Seed / numéro de partie</label><input id="seed" value="AZERT-001"><label>Difficulté</label><select id="difficulty"><option>initiation</option><option selected>standard</option><option>expert</option></select><button id="apply">Appliquer à la session</button><button id="hint">Envoyer un indice</button></div><div class="card"><h2>Créer une panne en direct</h2><select id="fault"><option value="fuite_eau">Fuite d'eau</option><option value="fuite_gaz">Fuite de gaz</option><option value="circuit_dangereux">Défaut électrique</option><option value="vmc_obstruee">VMC obstruée</option><option value="radiateur_froid">Radiateur froid</option></select><select id="room"><option>cuisine</option><option>sdb</option><option>wc</option><option>salon</option><option>chambre</option><option>entree</option></select><button id="spawn">Injecter la panne</button><button id="lock">Verrouiller / déverrouiller la sortie</button></div><div class="card"><h2>Metrics live</h2><div class="metrics"><div class="metric"><b id="mAnswered">0</b>réponses</div><div class="metric"><b id="mCorrect">0</b>correctes</div><div class="metric"><b id="mFaults">0</b>pannes</div><div class="metric"><b id="mSafety">100</b>sécurité</div></div><pre id="events"></pre></div></div></div><script src="p2p/session.js"></script><script>const p=new MeliPeer.PeerSession('trainer'),$=id=>document.getElementById(id);p.onstatus=s=>{$('status').textContent=s;$('status').className=s==='connected'?'ok':'warn'};p.onmessage=m=>{if(m.type==='metrics'){let x=m.payload;$('mAnswered').textContent=x.answered;$('mCorrect').textContent=x.correct;$('mFaults').textContent=x.activeFaults;$('mSafety').textContent=x.score?.safety??100;$('events').textContent=JSON.stringify(x.events?.slice(-6)||[],null,2)}};$('offer').onclick=async()=>$('local').value=await p.createOffer();$('answer').onclick=async()=>await p.acceptAnswer($('remote').value.trim());$('apply').onclick=()=>p.send('trainerCommand',{type:'session',seed:$('seed').value,difficulty:$('difficulty').value});$('spawn').onclick=()=>p.send('trainerCommand',{type:'spawnFault',fault:$('fault').value,room:$('room').value});$('hint').onclick=()=>p.send('trainerCommand',{type:'hint',text:prompt('Indice à envoyer :')||''});let locked=true;$('lock').onclick=()=>{locked=!locked;p.send('trainerCommand',{type:'lock',target:'exit',value:locked})};</script></body></html>
