<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeliCases Formateur</title><style>body{margin:0;background:#0b1118;color:#eef;font:15px system-ui}.wrap{max-width:1100px;margin:auto;padding:24px}h1{font-size:34px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#121c28;border:1px solid #ffffff20;border-radius:14px;padding:18px}textarea,input,select,button{width:100%;margin:6px 0;padding:10px;background:#0a1018;color:#fff;border:1px solid #ffffff28;border-radius:8px}button{background:#ff6038;color:#111;font-weight:800;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#09101a;padding:12px;border-radius:8px;text-align:center}.metric b{font-size:25px;display:block}.ok{color:#4ade80}.warn{color:#fb923c}pre{max-height:260px;overflow:auto}@media(max-width:750px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>Console <span style="color:#ff6038">Formateur</span></h1><div class="grid"><div class="card"><h2>Mission supervisée</h2><label>Seed de mission</label><input id="seed" value="AZERT-001"><label>Code de partie à 6 chiffres</label><input id="code" value="123456" maxlength="6"><button id="connectLocal">Connecter sur cet appareil</button><p>État : <b id="status">hors ligne</b></p><details><summary>Connexion WebRTC avancée</summary><button id="offer">Créer l'offre P2P</button><textarea id="local" rows="4"></textarea><textarea id="remote" rows="4" placeholder="Code réponse apprenant"></textarea><button id="answer">Valider la réponse</button></details></div><div class="card"><h2>Directeur adaptatif</h2><select id="topic"><option>gaz</option><option>electricite</option><option>eau</option><option>chauffage</option><option>ventilation</option></select><button id="force">Forcer le thème</button><button id="grant">Donner un indice adaptatif</button><button id="clear">Supprimer les pannes secondaires</button><button id="pauseLearner">Mettre en pause</button></div><div class="card"><h2>Créer une panne en direct</h2><select id="fault"><option value="fuite_eau">Fuite d'eau</option><option value="fuite_gaz">Fuite de gaz</option><option value="circuit_dangereux">Défaut électrique</option><option value="vmc_obstruee">VMC obstruée</option><option value="radiateur_froid">Radiateur froid</option></select><select id="room"><option>cuisine</option><option>sdb</option><option>wc</option><option>salon</option><option>chambre</option><option>entree</option></select><button id="spawn">Injecter la panne</button></div><div class="card"><h2>Metrics live</h2><div class="metrics"><div class="metric"><b id="mAnswered">0</b>réponses</div><div class="metric"><b id="mSafety">100</b>sécurité</div><div class="metric"><b id="mWeak">-</b>faible</div><div class="metric"><b id="mDirector">-</b>directeur</div></div><pre id="events"></pre></div></div></div><script src="p2p/session.js"></script><script src="data/trainer-channel.js"></script><script>const $=id=>document.getElementById(id);let ch;function recv(m){if(m.type==='telemetry'){const x=m.payload;$('mAnswered').textContent=x.done||x.answered||0;$('mSafety').textContent=x.safety??x.score?.safety??100;$('mWeak').textContent=x.weakest||'-';$('mDirector').textContent=x.plan?.type||'-';$('events').textContent=JSON.stringify(x,null,2)}}$('connectLocal').onclick=()=>{ch?.close();ch=new MeliTrainerChannel($('code').value);ch.on(recv);ch.send('trainer-ready',{seed:$('seed').value});$('status').textContent='connecté local';$('status').className='ok'};const send=(type,payload)=>ch?.send(type,{seed:$('seed').value,...payload});$('force').onclick=()=>send('override',{command:'force-topic',topic:$('topic').value});$('grant').onclick=()=>send('override',{command:'grant-hint',topic:$('topic').value});$('clear').onclick=()=>send('override',{command:'clear-secondary-faults'});$('pauseLearner').onclick=()=>send('command',{command:'pause'});$('spawn').onclick=()=>send('command',{command:'spawnFault',fault:$('fault').value,room:$('room').value});const p=new MeliPeer.PeerSession('trainer');p.onstatus=s=>$('status').textContent=s;p.onmessage=recv;$('offer').onclick=async()=>$('local').value=await p.createOffer();$('answer').onclick=async()=>await p.acceptAnswer($('remote').value.trim());</script></body></html>
