<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MeliCases — Formateur</title>
  <style>
    :root{color-scheme:dark;--ink:#eef4f7;--muted:#9fb0bb;--panel:#121c28;--line:#ffffff20;--accent:#ff6038;--green:#4ade80}
    *{box-sizing:border-box}body{margin:0;background:#0b1118;color:var(--ink);font:16px system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:32px 22px 64px}h1{font-size:34px;margin:0 0 24px}h1 span{color:var(--accent)}h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}.connect{grid-column:1/-1;text-align:center}.connect p{color:var(--muted)}label{display:block;margin:8px 0 4px}input,select,button{width:100%;margin:6px 0;padding:12px;border:1px solid #ffffff28;border-radius:10px;background:#09111b;color:#fff;font:inherit}button{border:0;background:var(--accent);color:#111;font-weight:850;cursor:pointer}.code{max-width:360px;height:92px;margin:16px auto;font-size:52px;font-weight:900;letter-spacing:.3em;text-align:center;text-transform:uppercase;padding-left:.3em}.status{font-size:18px}.ok{color:var(--green)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#09111b;padding:14px 8px;border-radius:10px;text-align:center;color:var(--muted)}.metric b{display:block;color:#fff;font-size:26px}.activity{min-height:48px;padding:12px;border-radius:10px;background:#09111b;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.connect{grid-column:auto}.actions,.metrics{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Console <span>Formateur</span></h1>
    <div class="grid">
      <section class="card connect">
        <h2>Rejoindre la mission</h2>
        <p>Saisissez le même code que celui affiché chez l’apprenant.</p>
        <label for="code">Code — 4 lettres maximum</label>
        <input class="code" id="code" value="MELI" maxlength="4" inputmode="text" autocomplete="off" spellcheck="false" aria-describedby="codeHelp">
        <small id="codeHelp">Lettres uniquement</small>
        <button id="connectLocal">SE CONNECTER</button>
        <p class="status">État : <b id="status">hors ligne</b></p>
      </section>

      <section class="card">
        <h2>Piloter la mission</h2>
        <label for="topic">Thème prioritaire</label>
        <select id="topic"><option>gaz</option><option>électricité</option><option>eau</option><option>chauffage</option><option>ventilation</option></select>
        <div class="actions"><button id="force">PRIORISER</button><button id="grant">DONNER UN INDICE</button><button id="clear">CALMER LA SITUATION</button><button id="pauseLearner">METTRE EN PAUSE</button></div>
      </section>

      <section class="card">
        <h2>Ajouter une situation</h2>
        <label for="fault">Situation</label>
        <select id="fault"><option value="fuite_eau">Fuite d’eau</option><option value="fuite_gaz">Fuite de gaz</option><option value="circuit_dangereux">Défaut électrique</option><option value="vmc_obstruee">VMC obstruée</option><option value="radiateur_froid">Radiateur froid</option></select>
        <label for="room">Pièce</label>
        <select id="room"><option>cuisine</option><option>sdb</option><option>wc</option><option>salon</option><option>chambre</option><option>entree</option></select>
        <button id="spawn">AJOUTER</button>
      </section>

      <section class="card">
        <h2>Progression</h2>
        <div class="metrics"><div class="metric"><b id="mAnswered">0</b>réponses</div><div class="metric"><b id="mSafety">100</b>sécurité</div><div class="metric"><b id="mWeak">—</b>à revoir</div><div class="metric"><b id="mDirector">—</b>rythme</div></div>
        <p class="activity" id="activity">En attente de la mission…</p>
      </section>
    </div>
  </main>
  <script src="data/trainer-channel.js"></script>
  <script>
    const $=id=>document.getElementById(id);let channel;
    const normalize=value=>value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
    $('code').addEventListener('keydown',event=>{if(event.key.length===1&&!/[a-z]/i.test(event.key))event.preventDefault()});
    $('code').addEventListener('input',event=>event.target.value=normalize(event.target.value));
    function receive(message){if(message.type!=='telemetry')return;const data=message.payload;$('mAnswered').textContent=data.done||data.answered||0;$('mSafety').textContent=data.safety??data.score?.safety??100;$('mWeak').textContent=data.weakest||'—';$('mDirector').textContent=data.plan?.type||'—';$('activity').textContent=`Mission active · ${data.done||data.answered||0} réponse(s) traitée(s)`}
    $('connectLocal').onclick=()=>{const code=normalize($('code').value);if(!code){$('status').textContent='saisissez un code';return}$('code').value=code;channel?.close();channel=new MeliTrainerChannel(code);channel.on(receive);channel.send('trainer-ready',{});$('status').textContent=`connecté · ${code}`;$('status').className='ok'};
    const send=(type,payload)=>channel?.send(type,payload);
    $('force').onclick=()=>send('override',{command:'force-topic',topic:$('topic').value.normalize('NFD').replace(/[\u0300-\u036f]/g,'')});
    $('grant').onclick=()=>send('override',{command:'grant-hint',topic:$('topic').value});
    $('clear').onclick=()=>send('override',{command:'clear-secondary-faults'});
    $('pauseLearner').onclick=()=>send('command',{command:'pause'});
    $('spawn').onclick=()=>send('command',{command:'spawnFault',fault:$('fault').value,room:$('room').value});
  </script>
</body>
</html>
